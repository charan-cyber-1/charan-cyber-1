# snake.yml
#
# GitHub Action that generates the animated contribution "snake" SVG
# referenced in README.md. Put this file at:
#   .github/workflows/snake.yml
# inside the special profile repo named exactly after your username
# (e.g. github.com/YOUR_GITHUB_USERNAME/YOUR_GITHUB_USERNAME).
#
# It runs on a schedule, on push, and can be triggered manually, then
# commits the generated SVG to an "output" branch, which is what the
# README's <img> tag points to.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, midnight UTC
  workflow_dispatch: {}    # allows manual "Run workflow" trigger
  push:
    branches:
      - main               # regenerate whenever you push to main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
